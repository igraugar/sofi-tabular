[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sofi-explainer"
version = "1.0.0"
description = "Sparseness Optimized Feature Importance, a post hoc explainer for classification and regression"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Isel Grau" }, { name = "Gonzalo Napoles" }]
keywords = ["explainable ai", "feature importance", "interpretability", "sparsity"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6", "seaborn>=0.12"]
progress = ["tqdm>=4.64"]
demo = ["matplotlib>=3.6", "seaborn>=0.12", "tqdm>=4.64", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
include = ["sofi*"]
